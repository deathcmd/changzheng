name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: changzheng-admin-web/package-lock.json
      - name: Install locked dependencies
        working-directory: changzheng-admin-web
        run: npm ci --ignore-scripts
      - name: Build admin frontend
        working-directory: changzheng-admin-web
        run: npm run build
      - name: Test admin request and authentication behavior
        working-directory: changzheng-admin-web
        run: npm test
      - name: Install Chromium for browser regressions
        working-directory: changzheng-admin-web
        run: npx --no-install playwright install --with-deps chromium
      - name: Test login, navigation, and logout in the built frontend
        working-directory: changzheng-admin-web
        run: npx --no-install playwright test
      - name: Audit dependencies
        working-directory: changzheng-admin-web
        run: npm audit --audit-level=high

  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check mini program JavaScript syntax
        run: find changzheng-miniprogram/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test mini program request and token refresh behavior
        run: node --test changzheng-miniprogram/tests/*.test.cjs

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment files
        run: |
          bash -n deploy.sh
          docker compose --env-file .env.example config --quiet
