name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: changzheng-admin-web/package-lock.json
      - name: Install locked dependencies
        working-directory: changzheng-admin-web
        run: npm ci --ignore-scripts
      - name: Build admin frontend
        working-directory: changzheng-admin-web
        run: npm run build
      - name: Audit production dependencies
        working-directory: changzheng-admin-web
        run: npm audit --audit-level=high

  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19'
      - name: Check mini program JavaScript syntax
        run: find changzheng-miniprogram/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment files
        run: |
          bash -n deploy.sh
          docker compose --env-file .env.example config --quiet
