name: Bug report
description: Report a reproducible defect without including sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, JWTs, WeChat session data, student records, or private deployment URLs. Report security issues through the process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release tag where the issue occurs.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mini program
        - Admin web
        - Gateway/authentication
        - Sport synchronization
        - Content/file handling
        - Ranking
        - Admin service
        - Docker/deployment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide a minimal, repeatable sequence using redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      render: shell
