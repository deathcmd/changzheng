services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: changzheng-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: changzheng_db
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - changzheng-net

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: changzheng-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - changzheng-net

  # Nacos注册/配置中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: changzheng-nacos
    restart: always
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - changzheng-net

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.3
    container_name: changzheng-rocketmq-namesrv
    restart: always
    command: sh mqnamesrv
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      - changzheng-net

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.1.3
    container_name: changzheng-rocketmq-broker
    restart: always
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    networks:
      - changzheng-net

  # API网关
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: changzheng-gateway
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
    depends_on:
      - nacos
      - redis
    networks:
      - changzheng-net

  # 认证服务
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    container_name: changzheng-auth
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_KEY: ${AES_KEY:?AES_KEY is required}
      WX_APPID: ${WX_APPID:?WX_APPID is required}
      WX_SECRET: ${WX_SECRET:?WX_SECRET is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - changzheng-net

  # 运动服务
  sport-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.sport
    container_name: changzheng-sport
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_KEY: ${AES_KEY:?AES_KEY is required}
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      ROCKETMQ_ENABLED: "true"
    depends_on:
      - nacos
      - mysql
      - redis
      - rocketmq-broker
    networks:
      - changzheng-net

  # 内容服务
  content-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.content
    container_name: changzheng-content
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      FILE_UPLOAD_URL: ${FILE_UPLOAD_URL:?FILE_UPLOAD_URL is required}
      FILE_UPLOAD_PATH: /opt/changzheng/uploads
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - changzheng-net
    volumes:
      - uploads_data:/opt/changzheng/uploads

  # 排行服务
  rank-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.rank
    container_name: changzheng-rank
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_KEY: ${AES_KEY:?AES_KEY is required}
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    depends_on:
      - nacos
      - mysql
      - redis
      - rocketmq-broker
    networks:
      - changzheng-net

  # 管理服务
  admin-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: changzheng-admin
    restart: always
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: changzheng
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - changzheng-net

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: changzheng-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./changzheng-admin-web/dist:/usr/share/nginx/html/admin:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - gateway
      - content-service
    networks:
      - changzheng-net

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
  nginx_logs:
  uploads_data:

networks:
  changzheng-net:
    driver: bridge
